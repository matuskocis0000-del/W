name: Build Rage Edition

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android64:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract mod project
        run: |
          mkdir -p extracted
          unzip -o RageEditionGeodeMod-AndroidBuild.zip -d extracted
          find extracted -type f -name CMakeLists.txt -exec dirname {} \; | head -1 > project_dir.txt
          echo "PROJECT_DIR=$(cat project_dir.txt)" >> $GITHUB_ENV

      - name: Build Android64 .geode
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: Android64
          sdk: latest
          cli: latest
          path: ${{ env.PROJECT_DIR }}

      - name: Upload .geode
        uses: actions/upload-artifact@v4
        with:
          name: RageEdition-Android64
          path: ${{ steps.build.outputs.build-output }}
