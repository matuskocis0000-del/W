<title>RAGE TOWER — CHAOS EDITION</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050505;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block;width:100%;height:100%}
#ui{position:fixed;top:10px;left:10px;color:white;font-weight:900;font-size:18px;line-height:1.35;text-shadow:3px 3px #000;z-index:5}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;color:white;font-size:34px;font-weight:1000;text-align:center;pointer-events:none;text-shadow:4px 4px #000;z-index:6}

.group{display:flex;gap:10px}.btn{pointer-events:auto;width:78px;height:78px;border:3px solid white;border-radius:50%;background:#222c;color:white;font-size:30px;font-weight:900;touch-action:none;box-shadow:0 5px 0 #000}
#jump{width:112px;border-radius:25px;font-size:17px}.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
#overlay{position:fixed;inset:0;display:none;z-index:20;background:#000d;align-items:center;justify-content:center}
#troll{max-width:92vw;max-height:72vh;image-rendering:auto;border:6px solid white;box-shadow:0 0 30px #fff}
#close{position:absolute;top:18px;right:18px;padding:12px 18px;font-size:20px;font-weight:900}
#start{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;background:#e33;color:#fff;border:4px solid #fff;border-radius:18px;padding:18px 28px;font-size:28px;font-weight:1000;box-shadow:0 8px 0 #000}
.buy{display:block;width:100%;margin:9px 0;padding:13px;border:2px solid white;border-radius:12px;background:#292929;color:white;font-size:16px;font-weight:900}
.buy:active{transform:scale(.98)}
</style>

  if(coins>=cost){
    spentThisRun+=cost;
    coins-=cost;
    fn();
    updateShop();
    beep(ASSETS.click);
  }
}
document.getElementById('shopBtn').onclick=shopOpen;
document.getElementById('closeShop').onclick=()=>{
  document.getElementById('shop').style.display='none';
  shopPaused=false;
};
document.getElementById('buyJump').onclick=()=>buy(600,()=>jumpLevel++);
document.getElementById('buyStop').onclick=()=>{
  if(lavaStop<60) buy(500,()=>{
  lavaStop=Math.min(60,lavaStop+1);
  lavaPausedUntil=Math.max(lavaPausedUntil,performance.now())+1000;
});
};
document.getElementById('buySpeed').onclick=()=>buy(700,()=>speedLevel++);

function beep(src){try{let a=new Audio(src);a.volume=.75;a.play().catch(()=>{});}catch(e){}}
function reset(){
 player={x:W/2-18,y:H-130,w:36,h:42,vx:0,vy:0,on:false,jumps:2};
 plats=[];cam=0;lava=H+180;worldH=H;nextPlatformY=H-55;
 for(let i=0;i<65;i++){
   let gap=52+Math.random()*8;
   let py=H-55-i*gap;
   let pw=145+Math.random()*65;
   let previous=plats[plats.length-1];
   let center;
   if(previous){
     let prevCenter=previous.x+previous.w/2;
     let maxShift=Math.min(28,W/2-20);
     center=prevCenter+(Math.random()*2-1)*maxShift;
     center=Math.max(pw/2,Math.min(W-pw/2,center));
   }else{
     center=W/2;
   }
   plats.push({x:center-pw/2,y:py,w:pw,h:18,bad:false});
   nextPlatformY=py;
 }
 plats[0]={x:W/2-110,y:H-55,w:220,h:18,bad:false};
 dead=won=false;started=true;start.style.display='none';msg.style.display='none';shake=0;
 spentThisRun=0;coins=0;
}
function doJump(){
 if(!started){reset();return}
 if(dead||won){reset();return}
 if(player.jumps>0){player.vy=-(13+jumpLevel*0.3);player.jumps--;beep(ASSETS.click)}
}
function bind(id,k){
 let b=document.getElementById(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();touch[k]=1});
 ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();touch[k]=0}));
}
bind('left','l');bind('right','r');document.getElementById('jump').onpointerdown=e=>{e.preventDefault();doJump()};
addEventListener('keydown',e=>{keys[e.key]=1;if(e.code==='Space'||e.key==='ArrowUp')doJump()});
addEventListener('keyup',e=>keys[e.key]=0);
start.onclick=()=>reset();

function die(){
 if(dead)return;dead=true;shake=18;msg.innerHTML='💀 RAGE!<br><small>JUMP = RESTART</small>';msg.style.display='flex';beep(ASSETS.getout);
 setTimeout(()=>{if(dead&&Math.random()<.7){troll.src=ASSETS.rick;overlay.style.display='flex'}},450);
}
function win(){
 won=true;msg.innerHTML='🏆 RAGE MASTER!<br><small>JUMP = AGAIN</small>';msg.style.display='flex';
 let h=Math.floor((H-55-player.y)/10);if(h>best){best=h;localStorage.rageBest=best;bestEl.textContent="Rekord: "+best}
 beep(ASSETS.cat);
}
document.getElementById('close').onclick=()=>overlay.style.display='none';

function loop(t){
 requestAnimationFrame(loop);
 x.save(); if(shake){x.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.88;if(shake<.2)shake=0}
 x.fillStyle='#08090d';x.fillRect(0,0,W,H);
 // stars / tower
 for(let i=0;i<35;i++){x.fillStyle='#ffffff22';x.fillRect((i*83)%W,(i*47+cam*.15)%H,2,2)}
 if(started&&!dead&&!won&&!shopPaused){
   let dir=(keys.ArrowLeft||keys.a||touch.l?-1:0)+(keys.ArrowRight||keys.d||touch.r?1:0);
   player.vx+=dir*(.82+speedLevel*.03);player.vx*=.88;let maxV=7+speedLevel*.18;player.vx=Math.max(-maxV,Math.min(maxV,player.vx));
   player.vy+=.42;player.x+=player.vx;player.y+=player.vy;
   if(player.x<-8)player.x=W-25;if(player.x>W+8)player.x=-25;
   player.on=false;
   for(const p of plats){
     if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+24){
       player.y=p.y-player.h;player.vy=0;player.on=true;player.jumps=2;
       
     }
   }
   if(player.y<H*.38)cam=H*.38-player.y;

   // Nekonečná veža: dopĺňaj platformy stále vyššie.
   while(nextPlatformY > player.y-1800){
     let gap=52+Math.random()*8;
     let previous = plats[plats.length-1];
     nextPlatformY-=gap;
     let pw=145+Math.random()*65;

     // Guaranteed reachable platform: its center can move only a small
     // distance from the previous platform's center.
     let prevCenter=previous.x+previous.w/2;
     let maxShift=Math.min(28,W/2-20);
     let center=prevCenter+(Math.random()*2-1)*maxShift;
     center=Math.max(pw/2,Math.min(W-pw/2,center));
     plats.push({x:center-pw/2,y:nextPlatformY,w:pw,h:18,bad:false});
   }

   // LÁVA: lava is in screen coordinates, so it visibly rises every frame.
   // The higher Mario climbs, the faster it rises, but it has a fair maximum speed.
   let height=Math.max(0,(H-55-player.y)/10);
   let lavaSpeed=0.10 + Math.min(height*0.000025,0.045);
   if(performance.now()>=lavaPausedUntil) lava-=lavaSpeed;

   // Collision is also in screen coordinates.
   if(player.y+player.h+cam>=lava)die();
   
   let currentHeight=Math.max(0,Math.floor((H-55-player.y)/10));
   score.textContent='♾️ Výška: '+currentHeight;
   coins=Math.max(0,currentHeight-spentThisRun);
 }
 // lava
 let ly=lava;
 x.fillStyle='#c22';x.fillRect(0,Math.max(0,ly),W,H-Math.max(0,ly));
 x.fillStyle='#ff7a00';
 for(let i=0;i<W;i+=28)x.fillRect(i,ly+Math.sin((i+t/80)/12)*5,22,6);
 // platforms
 for(const p of plats){let yy=p.y+cam;if(yy>-30&&yy<H+30){
   x.fillStyle=p.bad?'#d71920':'#58e66d';x.fillRect(p.x,yy,p.w,p.h);
   x.fillStyle=p.bad?'#7a0000':'#1b8f42';x.fillRect(p.x,yy+12,p.w,6);
 }}
 // Mario
 let py=player.y+cam;
 x.imageSmoothingEnabled=false;
 if(marioImg.complete) x.drawImage(marioImg,player.x-7,py-5,player.w+14,player.h+10);
 else { x.fillStyle='#e52521'; x.fillRect(player.x,py,player.w,player.h); }
 // Nyan cat appears as a rare flying distraction
 if(started&&!dead&&!won&&Math.floor(t/10000)%2===1){
   let img=new Image();img.src=ASSETS.nyan;x.globalAlpha=.55; x.drawImage(img,W-100,80+(Math.sin(t/500)*35),70,50);x.globalAlpha=1;
 }
 x.restore();
}
requestAnimationFrame(loop);
</script>
</body></html>
